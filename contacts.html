<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/favicon.js"></script>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Контакты — dxq-lab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header header--scrolled" role="banner">
    <div class="container header__inner">
      <a href="index.html" class="logo" aria-label="dxq-lab — на главную">
        <span class="logo__mark" aria-hidden="true"></span>
        <span class="brand-name">dxq-<span class="text-accent">lab</span></span>
      </a>
    </div>
  </header>

  <main class="legal-page">
    <div class="container">
      <a href="index.html" class="back-link" aria-label="Вернуться на главную">← На главную</a>

      <h1>Контакты и реквизиты</h1>
      <p class="legal-page__updated">Актуальные данные для связи с оператором сайта dxq-lab.</p>

      <!-- Contact data is injected by js/contacts.js -->
      <div id="contact-details" class="contact-details" aria-live="polite">
        <p class="contact-loading">Загрузка…</p>
      </div>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer__legal">
        <p class="footer__legal-note">
          <button type="button" class="contact-nav-btn" data-contact-nav>Контакты и реквизиты</button>
        </p>
      </div>
    </div>
  </footer>

  <script src="js/contacts.js" defer></script>
</body>
</html>
